# yaml-language-server: $schema=./vendor/solidworx/platform/platform-schema.json
platform:
  name: 'SolidTrack'
  version: '0.1.0-dev'

  security:
    two_factor:
      enabled: false

  doctrine:
    types:
      enable_utc_date: true

  models:
    user: App\Entity\User

  multi_tenancy:
    enabled: true

ui:
  icon_pack: tabler
  templates:
    login: '@Ui/Security/login.html.twig'
